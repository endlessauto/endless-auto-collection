name = "endless-auto-collection"
main = "worker.js"
compatibility_date = "2026-08-27"

[assets]
directory = "."
not_found_handling = "404-page"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "MEDIA_STATE"
class_name = "MediaState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MediaState"]
