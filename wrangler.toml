name = "endless-auto-collection"
main = "worker.js"
compatibility_date = "2026-08-27"

[assets]
directory = "."
not_found_handling = "404-page"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "MEDIA_STATE"
class_name = "MediaState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MediaState"]

[[durable_objects.bindings]]
name = "RAFFLE_STATE"
class_name = "RaffleState"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RaffleState"]

[[durable_objects.bindings]]
name = "POTLUCK_STATE"
class_name = "PotluckState"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["PotluckState"]

[[durable_objects.bindings]]
name = "GAME_STATE"
class_name = "GameState"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["GameState"]
