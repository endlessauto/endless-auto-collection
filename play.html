<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#050505">
<title>Endless Play | Endless Auto Collection</title>
<link rel="icon" href="/images/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--gold:#f0c869;--gold-d:#d4af37;--ink:#140f00;--line:#262626;--card:#0d0d0d;--mute:#a1a1aa}
body{margin:0;font:500 17px/1.4 Inter,system-ui,sans-serif;background:#050505;color:#f4f4f5;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) calc(2rem + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.hf{font-family:'Space Grotesk',Inter,sans-serif}
.gold{background:linear-gradient(145deg,#f5dfa0,#d4af37 50%,#b08a2a);-webkit-background-clip:text;background-clip:text;color:transparent}
main{max-width:30rem;margin:0 auto}
header{padding:1.4rem 0 .6rem;display:flex;align-items:baseline;justify-content:space-between;gap:1rem}
header b{font:700 1.3rem 'Space Grotesk',sans-serif;letter-spacing:-.3px}
header span{color:var(--mute);font-size:.85rem}
.eyebrow{font-size:.72rem;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--gold)}
h1,h2{font-family:'Space Grotesk',sans-serif;margin:.3rem 0 .5rem;line-height:1.05;letter-spacing:-.5px}
h1{font-size:clamp(2rem,9vw,2.6rem)}h2{font-size:1.5rem}
.sub{color:var(--mute);margin:0 0 1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:1.2rem;padding:1.1rem;margin:.8rem 0}
input[type=text]{width:100%;background:#0f0f0f;border:1px solid #2a2a2a;border-radius:.9rem;color:#fff;font:inherit;font-size:1.1rem;padding:.95rem 1rem;outline:none}
input[type=text]:focus{border-color:var(--gold-d)}
.btn{display:block;width:100%;border:0;border-radius:.95rem;cursor:pointer;font:700 1.05rem Inter,sans-serif;padding:1rem;background:linear-gradient(145deg,#f5dfa0 0%,#d4af37 45%,#9c7a22 100%);color:var(--ink);margin-top:.7rem;min-height:3.4rem}
.btn[disabled]{opacity:.55}
.err{color:#ff8a80;min-height:1.2rem;margin:.5rem 0 0;font-size:.92rem}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin:.6rem 0 .4rem}
.tabs button{font:700 .95rem Inter,sans-serif;color:#fff;background:#101010;border:1px solid var(--line);border-radius:.9rem;padding:.8rem;cursor:pointer;min-height:3rem}
.tabs button[aria-selected="true"]{background:linear-gradient(145deg,#f5dfa0,#d4af37 50%,#9c7a22);color:var(--ink);border-color:var(--gold-d)}
.dot{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:#ef4444;margin-left:.4rem;vertical-align:middle}
.bar{height:.5rem;border-radius:9999px;background:#1a1a1a;overflow:hidden;margin:.5rem 0 1rem}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#d4af37,#f5dfa0);transform-origin:left;transition:transform .25s linear}
.q-meta{display:flex;justify-content:space-between;align-items:baseline;color:var(--mute);font-size:.9rem}
.q-meta b{color:var(--gold);font-variant-numeric:tabular-nums;font-size:1.4rem}
.q-img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:1.1rem;border:1px solid var(--line);background:#111;display:block;margin:.4rem 0 .8rem}
.q-text{font:700 1.4rem/1.15 'Space Grotesk',sans-serif;margin:.2rem 0 1rem}
.opts{display:grid;gap:.6rem}
.opt{display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;font:700 1.1rem Inter,sans-serif;color:#fff;background:#121212;border:2px solid #2d2d2d;border-radius:1rem;padding:1rem;min-height:4rem;cursor:pointer}
.opt i{flex:none;width:2rem;height:2rem;border-radius:.6rem;display:grid;place-items:center;font-style:normal;font-weight:700;background:#222;color:var(--gold)}
.opt:active{transform:scale(.98)}
.opt.mine{border-color:var(--gold-d);background:#1c170a}
.opt.right{border-color:#4ade80;background:rgba(34,197,94,.14)}
.opt.wrong{border-color:#f87171;background:rgba(239,68,68,.12)}
.opt[disabled]{cursor:default}.opt[disabled]:not(.mine):not(.right):not(.wrong){opacity:.55}
.opt small{margin-left:auto;color:var(--mute);font-weight:500}
.big-res{text-align:center;padding:1.4rem 1rem}
.big-res .em{font:700 2.2rem 'Space Grotesk',sans-serif}.big-res .ok{color:#4ade80}.big-res .no{color:#f87171}
.big-res p{margin:.3rem 0;color:var(--mute)}
.rank{display:flex;gap:.7rem;align-items:center;padding:.65rem .8rem;background:#101010;border:1px solid var(--line);border-radius:.9rem;margin:.4rem 0}
.rank .n{flex:none;width:1.8rem;height:1.8rem;border-radius:50%;display:grid;place-items:center;background:#1d1a10;border:1px solid rgba(212,175,55,.45);color:var(--gold);font-weight:700;font-size:.85rem}
.rank .nm{flex:1;min-width:0;overflow-wrap:anywhere}.rank .sc{color:var(--gold);font-variant-numeric:tabular-nums;font-weight:700}
.wait{text-align:center;padding:2rem 1rem}
.pulse{width:.8rem;height:.8rem;border-radius:50%;background:var(--gold-d);margin:0 auto 1rem;animation:p 1.4s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}.bar i{transition:none}}
.cand{background:var(--card);border:1px solid var(--line);border-radius:1.2rem;overflow:hidden;margin:.9rem 0}
.cand.sel{border-color:var(--gold-d)}
.cand .ph{position:relative}
.cand img.o{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:#111}
.cand img.c{position:absolute;right:.6rem;bottom:.6rem;width:34%;aspect-ratio:4/3;object-fit:cover;border-radius:.8rem;border:2px solid #fff;background:#111}
.cand .in{padding:.8rem 1rem 1rem}
.cand b{display:block;font:700 1.15rem 'Space Grotesk',sans-serif}.cand span{color:var(--mute);font-size:.9rem}
.cand .btn{margin-top:.7rem}
.cand .btn.ghost{background:#161616;color:#fff;border:1px solid #333}
.cand .votes{float:right;color:var(--gold);font-weight:700}
.note{color:var(--mute);font-size:.88rem;text-align:center;margin:1rem 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header><b class="hf">Endless <span class="gold">Play</span></b><span id="who"></span></header>

  <section id="join" hidden>
    <p class="eyebrow">Friendsgiving · Endless Giving</p>
    <h1>Join the <span class="gold">game</span></h1>
    <p class="sub">Trivia and the fashion vote run from your phone. Type your first name and you're in. The trivia winner and the fashion vote winner each get two extra raffle entries.</p>
    <form class="card" id="joinForm" novalidate>
      <input type="text" id="name" maxlength="24" placeholder="Your first name" autocomplete="given-name" aria-label="Your first name">
      <div class="hp" aria-hidden="true"><label>Website<input type="text" id="website" tabindex="-1" autocomplete="off"></label></div>
      <button class="btn" id="joinBtn" type="submit">Join</button>
      <p class="err" id="joinErr" role="alert"></p>
    </form>
    <p class="note">Your name shows on the leaderboard. We don't store anything else.</p>
  </section>

  <section id="app" hidden>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="t-trivia" aria-selected="true">Trivia<span class="dot" id="dotT" hidden></span></button>
      <button type="button" role="tab" id="t-vote" aria-selected="false">Fashion vote<span class="dot" id="dotV" hidden></span></button>
    </div>
    <div id="trivia"></div>
    <div id="vote" hidden></div>
  </section>
</main>

<script>
(function(){
  var E=location.search.indexOf('e=sun')>-1?'sun':'fri';
  var API='/api/game';
  var $=function(i){return document.getElementById(i)};
  var token='',tab='trivia',tv=null,vv=null,offset=0,timer=null,pollT=null,lastKey='';
  try{token=localStorage.getItem('eac.game.token.'+E)||''}catch(e){}
  function api(path,body){
    var u=API+path+(path.indexOf('?')>-1?'&':'?')+'e='+E;
    return fetch(u,{method:body?'POST':'GET',headers:body?{'content-type':'application/json'}:undefined,body:body?JSON.stringify(body):undefined}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Something went wrong.');return j})});
  }
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function clear(n){while(n.firstChild)n.removeChild(n.firstChild)}

  // MARK: - Join
  function showJoin(){
    $('join').hidden=false;$('app').hidden=true;
    var rt='';try{rt=localStorage.getItem('eac.raffle.token')||''}catch(e){}
    if(rt){fetch('/api/raffle/state?token='+encodeURIComponent(rt)).then(function(r){return r.json()}).then(function(s){if(s&&s.me&&s.me.name&&!$('name').value)$('name').value=s.me.name.split(' ')[0]}).catch(function(){})}
  }
  $('joinForm').addEventListener('submit',function(ev){
    ev.preventDefault();var n=$('name').value.trim();
    if(!n){$('joinErr').textContent='Enter your first name.';return}
    var rt='';try{rt=localStorage.getItem('eac.raffle.token')||''}catch(e){}
    $('joinBtn').disabled=true;$('joinErr').textContent='';
    api('/join',{name:n,website:$('website').value,raffleToken:rt}).then(function(j){
      token=j.token;try{localStorage.setItem('eac.game.token.'+E,token)}catch(e){}
      start();
    }).catch(function(x){$('joinErr').textContent=x.message;$('joinBtn').disabled=false});
  });

  // MARK: - Shell
  function start(){
    $('join').hidden=true;$('app').hidden=false;
    $('t-trivia').onclick=function(){setTab('trivia')};$('t-vote').onclick=function(){setTab('vote')};
    refresh();
  }
  function setTab(t){
    tab=t;$('t-trivia').setAttribute('aria-selected',t==='trivia');$('t-vote').setAttribute('aria-selected',t==='vote');
    $('trivia').hidden=t!=='trivia';$('vote').hidden=t!=='vote';
    if(t==='trivia')$('dotT').hidden=true;else $('dotV').hidden=true;
    refresh();
  }
  function refresh(){
    clearTimeout(pollT);
    var p=tab==='trivia'?api('/trivia/state?token='+encodeURIComponent(token)):api('/vote/state?token='+encodeURIComponent(token));
    p.then(function(s){
      offset=0;
      if(tab==='trivia'){offset=s.now-Date.now();if(!s.me&&token){token='';try{localStorage.removeItem('eac.game.token.'+E)}catch(e){}showJoin();return}tv=s;renderTrivia()}
      else{if(token&&s.joined===false){token='';try{localStorage.removeItem('eac.game.token.'+E)}catch(e){}showJoin();return}vv=s;renderVote()}
      if(s.me)$('who').textContent=s.me.name;
      schedule();
    }).catch(function(){schedule(4000)});
  }
  function schedule(ms){
    if(document.hidden){pollT=setTimeout(schedule,3000);return}
    var d=ms||(tab==='trivia'?(tv&&tv.phase==='question'?1500:2500):6000);
    pollT=setTimeout(refresh,d);
  }
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&token)refresh()});

  // MARK: - Trivia
  var LET=['A','B','C','D'];
  function renderTrivia(){
    var box=$('trivia'),s=tv,key=s.phase+'|'+s.qi+'|'+(s.me&&s.me.choice)+'|'+(s.top?s.top.length:0)+'|'+s.players;
    if(key===lastKey)return;
    lastKey=key;clearInterval(timer);clear(box);
    if(s.phase==='lobby'){
      var w=el('div','card wait');w.appendChild(el('div','pulse'));
      w.appendChild(el('h2','', "You're in, "+s.me.name));
      w.appendChild(el('p','sub','The game starts when the host starts it. Keep this screen open.'));
      w.appendChild(el('p','eyebrow',s.players+(s.players===1?' player':' players')+' here'));
      box.appendChild(w);return;
    }
    if(s.phase==='final'){
      box.appendChild(el('p','eyebrow','Final results'));
      box.appendChild(el('h1','','You finished #'+s.me.rank));
      box.appendChild(el('p','sub',s.me.score+' points out of '+s.me.of+' players.'));
      (s.top||[]).forEach(function(r){box.appendChild(rankRow(r,s.me))});
      box.appendChild(el('p','note','The winner gets two extra raffle entries. The host will announce them.'));
      return;
    }
    var q=s.q;
    var meta=el('div','q-meta');meta.appendChild(el('span','','Question '+(s.qi+1)+' of '+s.total));var tm=el('b','','');tm.id='tm';meta.appendChild(tm);box.appendChild(meta);
    var bar=el('div','bar');var bi=el('i');bi.id='bi';bar.appendChild(bi);box.appendChild(bar);
    if(q.image){var im=el('img','q-img');im.src=q.image;im.alt='Zoomed photo of a car';box.appendChild(im);if(q.credit&&s.phase==='reveal')box.appendChild(el('p','note','Photo: '+q.credit+' via Wikimedia Commons'))}
    box.appendChild(el('p','q-text',q.prompt));
    if(s.phase==='reveal'){
      var r=el('div','card big-res');
      var answered=s.me.choice!==null;
      r.appendChild(el('div','em '+(s.me.correct?'ok':'no'),s.me.correct?'Correct':(answered?'Not this time':'No answer')));
      r.appendChild(el('p','',(s.me.correct?'+'+s.me.gained+' points':'0 points')+' · #'+s.me.rank+' of '+s.me.of));
      box.appendChild(r);
    }
    var grid=el('div','opts');
    q.options.forEach(function(o,i){
      var b=el('button','opt');b.type='button';b.appendChild(el('i','',LET[i]));b.appendChild(el('span','',o));
      var locked=s.phase!=='question'||s.me.choice!==null;
      if(s.me.choice===i)b.classList.add('mine');
      if(s.phase==='reveal'){if(i===s.answer)b.classList.add('right');else if(s.me.choice===i)b.classList.add('wrong');b.appendChild(el('small','',String(s.dist[i])))}
      b.disabled=locked;
      b.onclick=function(){
        if(b.disabled)return;
        grid.querySelectorAll('.opt').forEach(function(x){x.disabled=true});b.classList.add('mine');
        api('/trivia/answer',{token:token,choice:i}).then(function(){s.me.choice=i;lastKey='';refresh()}).catch(function(x){s.me.choice=null;lastKey='';refresh()});
      };
      grid.appendChild(b);
    });
    box.appendChild(grid);
    if(s.phase==='question'&&s.me.choice!==null)box.appendChild(el('p','note','Answer locked. Waiting for time to run out.'));
    if(s.phase==='reveal'){
      box.appendChild(el('p','eyebrow','Leaderboard'));
      (s.top||[]).forEach(function(r){box.appendChild(rankRow(r,s.me))});
      box.appendChild(el('p','note','Next question starts when the host moves on.'));
    }
    if(s.phase==='question'){
      var span=(s.seconds||20)*1000;
      function tick(){
        var left=Math.max(0,s.endsAt-(Date.now()+offset));
        $('tm').textContent=Math.ceil(left/1000);
        $('bi').style.transform='scaleX('+Math.min(1,left/span)+')';
        if(left<=0){clearInterval(timer);setTimeout(refresh,300)};
      }
      tick();timer=setInterval(tick,250);
    }
  }
  function rankRow(r,me){var d=el('div','rank');d.appendChild(el('span','n',String(r.rank)));d.appendChild(el('span','nm',r.name+(me&&r.name===me.name?' (you)':'')));d.appendChild(el('span','sc',String(r.score)));return d}

  // MARK: - Vote
  function renderVote(){
    var box=$('vote'),s=vv;clear(box);
    box.appendChild(el('p','eyebrow','Fashion vote'));
    box.appendChild(el('h1','','Outfit and car'));
    if(!s.candidates.length){box.appendChild(el('p','sub','Photos are coming. Check back soon.'));return}
    var msg={closed:'Voting opens soon. You can look through the entries now.',open:'Pick one. You can change your vote until the host closes voting.',revealed:'Voting is closed.'}[s.mode];
    box.appendChild(el('p','sub',msg));
    var res={};if(s.results)s.results.forEach(function(r){res[r.id]=r});
    s.candidates.forEach(function(c){
      var d=el('div','cand'+(s.myVote===c.id?' sel':''));
      var ph=el('div','ph');var im=el('img','o');im.src=API+'/vote/photo?id='+c.id+'&s=photo&e='+E;im.alt=c.name+' outfit';im.loading='lazy';ph.appendChild(im);
      if(c.hasCar){var ci=el('img','c');ci.src=API+'/vote/photo?id='+c.id+'&s=car&e='+E;ci.alt=c.name+' car';ci.loading='lazy';ph.appendChild(ci)}
      d.appendChild(ph);
      var inn=el('div','in');var b=el('b','',c.name);
      if(s.mode==='revealed'&&res[c.id]){var v=el('span','votes',res[c.id].votes+(res[c.id].votes===1?' vote':' votes')+(res[c.id].winner?' · winner':''));b.appendChild(v)}
      inn.appendChild(b);if(c.caption)inn.appendChild(el('span','',c.caption));
      if(s.mode==='open'){
        var bt=el('button','btn'+(s.myVote===c.id?' ghost':''),s.myVote===c.id?'Your vote':'Vote for '+c.name);bt.type='button';
        bt.onclick=function(){bt.disabled=true;api('/vote/cast',{token:token,candidate:c.id}).then(function(){refresh()}).catch(function(x){bt.textContent=x.message;setTimeout(refresh,1500)})};
        inn.appendChild(bt);
      }else if(s.myVote===c.id){inn.appendChild(el('span','','Your vote'))}
      d.appendChild(inn);box.appendChild(d);
    });
    if(s.mode==='revealed')box.appendChild(el('p','note','The winner gets two extra raffle entries. The host will announce them.'));
  }

  if(token)api('/trivia/state?token='+encodeURIComponent(token)).then(function(s){if(s.me)start();else{token='';showJoin()}}).catch(showJoin);else showJoin();
})();
</script>
<script src="/js/analytics.js" defer></script>
</body>
</html>
