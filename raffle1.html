<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Giveaway entries</title>
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#050505;color:#e4e4e7;padding:1.5rem}
main{max-width:56rem;margin:0 auto}
h1{color:#fff;font-size:1.5rem}
h2{color:#f0c869;font-size:.8rem;letter-spacing:2px;text-transform:uppercase;margin:2rem 0 .7rem}
input{background:#0f0f0f;border:1px solid #2a2a2a;border-radius:.6rem;color:#fff;font:inherit;padding:.6rem .8rem}
button{border:0;border-radius:.6rem;cursor:pointer;font:inherit;font-weight:600;padding:.6rem 1rem;background:linear-gradient(145deg,#f5dfa0,#d4af37 50%,#9c7a22);color:#140f00}
button.ghost{background:#1a1a1a;color:#ddd;border:1px solid #333}
button[disabled]{opacity:.5;cursor:default}
.card{background:#0d0d0d;border:1px solid #232323;border-radius:.9rem;padding:1rem;margin-bottom:.7rem}
.prize{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;justify-content:space-between}
.prize b{color:#fff}
.win{color:#d4af37;margin-top:.4rem;font-size:.95rem;line-height:1.5}
.meta{color:#777;font-size:.85rem}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{text-align:left;padding:.45rem .5rem;border-bottom:1px solid #1d1d1d}
th{color:#777;font-weight:400}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:.6rem;margin-top:1.2rem}.stats div{background:#0d0d0d;border:1px solid #232323;border-radius:.9rem;padding:.8rem;text-align:center}.stats b{display:block;font-size:1.6rem;color:#fff}.stats span{font-size:.7rem;letter-spacing:1.5px;text-transform:uppercase;color:#777}
#msg{color:#ff8a80;min-height:1.2rem}
</style>
</head>
<body>
<main>
  <h1>Giveaway entries</h1>
  <form id="auth"><input type="password" id="key" placeholder="Password" autocomplete="current-password" autofocus> <button type="submit">Unlock</button></form>
  <div id="msg"></div>
  <div id="app" hidden>
    <div class="stats"><div><b id="stPeople">0</b><span>People</span></div><div><b id="stPoints">0</b><span>Total points</span></div><div><b id="stIg">0</b><span>Instagram</span></div><div><b id="stYt">0</b><span>YouTube</span></div><div><b id="stGr">0</b><span>Google</span></div></div>
    <h2>Winners</h2>
    <div id="prizes"></div>
    <h2>Entries <span class="meta" id="count"></span></h2>
    <input type="search" id="q" placeholder="Search name, email, or handle" style="min-width:16rem"> <button class="ghost" id="csv" type="button">Download CSV</button> <button class="ghost" id="refresh" type="button">Refresh</button>
    <div style="overflow-x:auto;margin-top:.8rem"><table><thead><tr><th>#</th><th>Name</th><th>Email</th><th>Instagram</th><th>YouTube</th><th>Google</th><th>Points</th><th>Flags</th><th>Entered</th></tr></thead><tbody id="rows"></tbody></table></div>
  </div>
</main>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var key='',data=null;try{key=sessionStorage.getItem('eac.raffle1')||''}catch(e){}
  function call(path,body){
    return fetch('/api/raffle'+path,{method:body?'POST':'GET',headers:{authorization:'Bearer '+key,'content-type':'application/json'},body:body?JSON.stringify(body):undefined}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Request failed');return j})});
  }
  function td(tr,text){var c=document.createElement('td');c.textContent=text;tr.appendChild(c)}
  function render(){
    $('app').hidden=false;
    $('auth').hidden=true;
    $('count').textContent='('+data.entries.length+')';
    var pts=0,ig=0,yt=0,gr=0;data.entries.forEach(function(e){pts+=e.tickets;if(e.ig_at)ig++;if(e.yt_at)yt++;if(e.google_at)gr++});$('stGr').textContent=gr;
    $('stPeople').textContent=data.entries.length;$('stPoints').textContent=pts;$('stIg').textContent=ig;$('stYt').textContent=yt;
    var byId={};data.entries.forEach(function(e){byId[e.id]=e});
    var box=$('prizes');box.textContent='';
    data.prizes.forEach(function(name,i){
      var active=data.winners.filter(function(w){return w.prize_index===i&&w.status==='active'})[0];
      var card=document.createElement('div');card.className='card';
      var row=document.createElement('div');row.className='prize';
      var b=document.createElement('b');b.textContent=(i+1)+'. '+name;row.appendChild(b);
      var btn=document.createElement('button');btn.textContent=active?'Redraw':'Draw winner';if(active)btn.className='ghost';
      btn.onclick=function(){
        if(active&&!confirm('Replace the current winner for "'+name+'"?'))return;
        btn.disabled=true;
        call('/admin/draw',{prize:i,redraw:!!active}).then(load).catch(function(x){$('msg').textContent=x.message;btn.disabled=false});
      };
      row.appendChild(btn);card.appendChild(row);
      if(!active){var n=document.createElement('div');n.className='meta';n.textContent='Not drawn yet';card.appendChild(n)}
      if(active){
        var e=byId[active.entry_id]||{};
        var w=document.createElement('div');w.className='win';
        w.textContent=e.name+' · '+e.email+(e.instagram_handle?' · @'+e.instagram_handle:'')+' · '+e.tickets+' pts';
        card.appendChild(w);
        var m=document.createElement('div');m.className='meta';
        m.textContent='Drawn '+new Date(active.drawn_at).toLocaleString()+' from '+active.pool_size+' people, '+active.total_tickets+' tickets';
        card.appendChild(m);
      }
      box.appendChild(card);
    });
    var tb=$('rows');tb.textContent='';
    var q=$('q').value.trim().toLowerCase();
    var won={};data.winners.forEach(function(w){if(w.status==='active')won[w.entry_id]=true});
    data.entries.slice().sort(function(a,b){return b.tickets-a.tickets||a.id-b.id}).filter(function(e){
      return !q||(e.name+' '+e.email+' '+(e.instagram_handle||'')).toLowerCase().indexOf(q)>-1;
    }).forEach(function(e){
      var tr=document.createElement('tr');if(won[e.id])tr.style.color='#d4af37';
      td(tr,e.id);td(tr,e.name);td(tr,e.email);td(tr,e.instagram_handle?'@'+e.instagram_handle:'');td(tr,e.yt_at?'yes':'');td(tr,e.google_at?'yes':'');td(tr,e.tickets);var fl=[];if(e.same_name)fl.push('same name');if(e.same_network)fl.push('same network');td(tr,fl.join(', '));td(tr,new Date(e.created_at).toLocaleString());
      tb.appendChild(tr);
    });
  }
  function load(){$('msg').textContent='';return call('/admin/entries').then(function(d){data=d;try{sessionStorage.setItem('eac.raffle1',key)}catch(e){}render()}).catch(function(x){$('msg').textContent=x.message;if(/Wrong password/.test(x.message)){key='';try{sessionStorage.removeItem('eac.raffle1')}catch(e){}$('auth').hidden=false}})}
  $('auth').addEventListener('submit',function(e){e.preventDefault();key=$('key').value;load()});
  $('q').addEventListener('input',function(){if(data)render()});
  $('refresh').addEventListener('click',load);
  setInterval(function(){if(data&&!document.hidden)load()},30000);
  if(key)load();
  $('csv').addEventListener('click',function(){
    var q=function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'};
    var lines=['id,name,email,instagram,youtube,google,points,flags,entered'];
    data.entries.forEach(function(e){lines.push([e.id,e.name,e.email,e.instagram_handle,e.yt_at?'yes':'',e.google_at?'yes':'',e.tickets,[e.same_name?'same name':'',e.same_network?'same network':''].filter(Boolean).join('; '),new Date(e.created_at).toISOString()].map(q).join(','))});
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv'}));a.download='giveaway-entries.csv';a.click();
  });
})();
</script>
</body>
</html>
